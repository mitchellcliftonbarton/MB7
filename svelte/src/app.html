<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Apply persisted site settings before paint to avoid a flash (see $lib/stores/siteSettings.js) -->
		<script>
			try {
				var s = JSON.parse(localStorage.getItem('siteSettings') || '{}');
				var b = document.body.classList;
				if (s.hideGrid) b.add('hide-grid');
				if (s.hideCurrentDate) b.add('hide-current-date');
				if (s.hideAnnouncements) b.add('hide-announcements');
				document.body.dataset.difficulty = s.difficulty || 'easy';
			} catch (e) {}
		</script>
		<div class="flex flex-col min-h-[100svh]">%sveltekit.body%</div>
	</body>
</html>
